name: Bug report
description: 再現可能な不具合を報告します
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 秘密情報、メール本文、添付ファイルを含めないでください。
  - type: input
    id: versions
    attributes:
      label: バージョン
      description: NexaPress、拡張、PHPのバージョン
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果と実際の結果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 機密情報を除去したログ
